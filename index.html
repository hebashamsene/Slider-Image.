<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="slider-container">
        <div class="slide-number" id="slide-number"></div>
        <img src="Images/download (1).jpg" alt="">
        <img src="Images/download (2).jpg" alt="">
        <img src="Images/download (3).jpg" alt="">
        <img src="Images/download (4).jpg" alt="">

    </div>
    <div class="slider-controls">
        <span class="prev" id="prev">Previous</span>
        <span class="indicators" id="indicators"></span>
        <span class="next" id="next">Next</span>
    </div>



    <script src="javaScriot.js"></script>
</body>

</html>
